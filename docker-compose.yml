services:
  postgres:
    image: postgres:16-alpine
    container_name: fanilo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fanilo
      POSTGRES_USER: fanilo
      POSTGRES_PASSWORD: fanilo
    ports:
      - "5432:5432"
    volumes:
      - fanilo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanilo -d fanilo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    container_name: fanilo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://fanilo:fanilo@postgres:5432/fanilo
      AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"

volumes:
  fanilo-postgres-data:
