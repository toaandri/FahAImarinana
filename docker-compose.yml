services:
  postgres:
    image: postgres:16-alpine
    container_name: fanilo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fanilo
      POSTGRES_USER: fanilo
      POSTGRES_PASSWORD: fanilo
    volumes:
      - fanilo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanilo -d fanilo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    container_name: fanilo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: fanilo
      DATABASE_USER: fanilo
      DATABASE_PASSWORD: fanilo
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTO_CREATE_TABLES: "false"
      PUBLIC_DATABASE_URL: ${PUBLIC_DATABASE_URL:-}
      DEFAULT_NEWSROOM_ID: ${DEFAULT_NEWSROOM_ID:-1}
      DEFAULT_DATASET: ${DEFAULT_DATASET:-real}
      PUBLIC_NEWSROOM_ID: ${PUBLIC_NEWSROOM_ID:-1}
      PUBLIC_DATASET: ${PUBLIC_DATASET:-real}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
      JWT_ISSUER: ${JWT_ISSUER:-fa-ai-marinana}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fa-ai-marinana-api}
      REFRESH_EXPIRE_DAYS: ${REFRESH_EXPIRE_DAYS:-30}
      INVITATION_EXPIRE_HOURS: ${INVITATION_EXPIRE_HOURS:-48}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AUTH_REQUESTS_PER_MINUTE: ${AUTH_REQUESTS_PER_MINUTE:-60}
      PUBLIC_REQUESTS_PER_MINUTE: ${PUBLIC_REQUESTS_PER_MINUTE:-60}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-45}
      MAHARAVO_ENABLED: ${MAHARAVO_ENABLED:-false}
      MAHARAVO_BASE_URL: ${MAHARAVO_BASE_URL:-}
      MAHARAVO_API_KEY: ${MAHARAVO_API_KEY:-}
      MAHARAVO_ALLOWED_MODEL_VERSIONS: ${MAHARAVO_ALLOWED_MODEL_VERSIONS:-}
      MAHARAVO_CONNECT_TIMEOUT: ${MAHARAVO_CONNECT_TIMEOUT:-10}
      MAHARAVO_READ_TIMEOUT: ${MAHARAVO_READ_TIMEOUT:-30}
      MAHARAVO_WRITE_TIMEOUT: ${MAHARAVO_WRITE_TIMEOUT:-10}
      MAHARAVO_POOL_TIMEOUT: ${MAHARAVO_POOL_TIMEOUT:-5}
      MAHARAVO_TOTAL_TIMEOUT: ${MAHARAVO_TOTAL_TIMEOUT:-90}
      MAHARAVO_MAX_ATTEMPTS: ${MAHARAVO_MAX_ATTEMPTS:-3}
      MAHARAVO_BACKOFF_SECONDS: ${MAHARAVO_BACKOFF_SECONDS:-0.5}
      MAHARAVO_MAX_BACKOFF_SECONDS: ${MAHARAVO_MAX_BACKOFF_SECONDS:-10}
      MAHARAVO_REQUESTS_PER_MINUTE: ${MAHARAVO_REQUESTS_PER_MINUTE:-30}
      MAHARAVO_MAX_CONCURRENT_REQUESTS: ${MAHARAVO_MAX_CONCURRENT_REQUESTS:-2}
      MAHARAVO_MAX_REQUEST_BYTES: ${MAHARAVO_MAX_REQUEST_BYTES:-262144}
      MAHARAVO_MAX_RESPONSE_BYTES: ${MAHARAVO_MAX_RESPONSE_BYTES:-524288}
      MAHARAVO_MAX_SOURCES: ${MAHARAVO_MAX_SOURCES:-10}
      MAHARAVO_MAX_DOCUMENTS: ${MAHARAVO_MAX_DOCUMENTS:-5}
      MAHARAVO_MAX_EVIDENCE: ${MAHARAVO_MAX_EVIDENCE:-20}
      MAHARAVO_MAX_CLAIMS: ${MAHARAVO_MAX_CLAIMS:-50}
      MAHARAVO_MAX_ANALYSIS_CHARS: ${MAHARAVO_MAX_ANALYSIS_CHARS:-50000}
      MAHARAVO_MAX_DRAFT_CHARS: ${MAHARAVO_MAX_DRAFT_CHARS:-20000}
      MAHARAVO_MAX_QUOTE_CHARS: ${MAHARAVO_MAX_QUOTE_CHARS:-5000}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "18000:8000"

volumes:
  fanilo-postgres-data:
